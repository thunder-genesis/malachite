[package]
name = "malachite"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = "1.4.0"
anyhow = "1"
askama = "0.15.1"
borsh = "=1.5.7"
dotenvy = "0.15.7"
clap = { version = "4.5.54", features = ["env", "derive"] }
cloudflare = "0.14.0"
futures-util = "0.3.31"
openstack_sdk = "=0.21.4"
primitive-types = { git = "https://github.com/velas/parity-common", branch = "bump-borsh", features = ["borsh", "serde"] }
rand = "0.9.2"
reqwest = "0.13.1"
serde = "1.0.219"
serde_json = "1.0.149"
solana-client = { version = "=2.3.1"}
solana-sdk = { version = "=2.3.1", features = ["full", "borsh"] }
ssh2 = "0.9"
surge-ping = "0.8.2"
tempfile = "3.23.0"
thiserror = "2"
tgbot = "0.41.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
# tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
veil = "0.3.0"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }