[package]
name = "malachite"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-rt = "2.10.0"
actix-web = "4.11.0"
alloy = "1.0.22"
anyhow = "1"
askama = "0.14.0"
base64 = "0.22.1"
borsh = "1.5"
dotenvy = "0.15.7"
clap = { version = "4.5.41", features = ["env", "derive"] }
cloudflare = "0.14.0"
futures-util = "0.3.31"
openstack_sdk = "=0.21.4"
primitive-types = { git = "https://github.com/velas/parity-common", branch = "bump-borsh", features = ["borsh", "serde"] }
rand = "0.9.1"
serde = "1.0.219"
serde_json = "1.0.140"
solana-client = { version = "2.3.1"}
solana-sdk = { version = "2.3.1", features = ["full", "borsh"] }
ssh2 = "0.9"
surge-ping = "0.8.2"
thiserror = "2"
tgbot = "0.39.1"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
# tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
veil = "0.2.0"
uuid = { version = "1.17.0", features = ["v4"] }