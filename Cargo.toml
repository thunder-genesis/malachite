[package]
name = "malachite"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = "2.4.1"
anyhow = "1.0.104"
askama = "0.16.0"
borsh = "1.8.1"
dotenvy = "0.15.7"
clap = { version = "4.6.6", features = ["env", "derive"] }
cloudflare = "0.14.0"
futures-util = "0.3.34"
openstack_sdk = "=0.22.7"
primitive-types = { git = "https://github.com/velas/parity-common", branch = "bump-borsh", features = ["borsh", "serde"] }
rand = "0.10.2"
reqwest = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
solana-client = { version = "=2.3.1"}
solana-sdk = { version = "=2.3.1", features = ["full", "borsh"] }
ssh2 = "0.9.6"
surge-ping = "0.9.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tgbot = "0.47.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
# tracing-journald = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
veil = "0.3.0"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }